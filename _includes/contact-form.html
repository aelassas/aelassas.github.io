<style>
  .contact-form {
    display: grid;
    gap: 1rem;
    max-width: 600px;
    padding: 1.25rem;
    background-color: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }

  .contact-form input,
  .contact-form textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background-color: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius-sm);
    transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
  }

  .contact-form input::placeholder,
  .contact-form textarea::placeholder {
    color: var(--text-muted);
  }

  .contact-form input:focus,
  .contact-form textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--focus-ring);
  }

  .contact-form textarea {
    min-height: 220px;
    resize: vertical;
  }

  .contact-form button[type="submit"] {
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    background-color: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.2s var(--ease), transform 0.2s var(--ease);
  }

  .contact-form button[type="submit"]:hover {
    background-color: var(--btn-hover);
    transform: translateY(-1px);
  }
</style>

<form class="contact-form" action="https://formspree.io/f/mzzaobrn" method="POST">
  <input type="text" name="name" placeholder="Name" aria-label="Name" autocomplete="name" required>
  <input type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
  <textarea name="message" placeholder="Message" aria-label="Message" required></textarea>
  <button type="submit">Send</button>
</form>
