<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<meta name="theme-color" content="#f3f3f4">

<script>
  (function () {
    var theme = 'light';
    try { if (localStorage.getItem('theme') === 'dark') theme = 'dark'; } catch (e) { /* storage unavailable */ }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.classList.add('js');
    if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0b0e');
  })();
</script>

<link rel="preload" href="{{ '/assets/fonts/outfit-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

<script type="module">
  import { initGA } from "{{ '/assets/js/analytics.js' | relative_url }}?v={{ site.time | date: '%s' }}";
  initGA('G-9C49146FEV');
</script>
